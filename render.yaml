# Render (https://render.com) — free tier full-stack deploy
# 1. Push this repo to GitHub.
# 2. In Render: New -> Blueprints -> connect the repo.
# 3. This file auto-creates the Postgres database + web service.
# 4. Set CORS_ORIGINS to your frontend URL (e.g. https://nutrimeasure-ai.vercel.app).

services:
  - type: web
    name: nutrimeasure-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.seed.seed_database && gunicorn run:app --bind 0.0.0.0:$PORT --workers 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nutrimeasure-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://nutrimeasure-ai.vercel.app
      - key: DEMO_MODE
        value: "true"
      - key: CHATBOT_DEMO_MODE
        value: "true"
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
    databases:
      - name: nutrimeasure-db
        plan: free
        databaseName: nutrimeasure
        user: nutrimeasure
